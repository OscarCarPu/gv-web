name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          git config --global --add safe.directory /home/ocp/docker/gv/gv-web
          cd /home/ocp/docker/gv/gv-web
          git pull
          make up

      - name: Push to ECR
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-south-2
          REGISTRY: 715831355178.dkr.ecr.eu-south-2.amazonaws.com
        run: |
          aws() { docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION amazon/aws-cli "$@"; }
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag gv-web:latest "$REGISTRY/gv-web:latest"
          docker push "$REGISTRY/gv-web:latest"
          # Keep latest and the manifests its index references; delete everything else.
          keep=$(aws ecr batch-get-image --repository-name gv-web --image-ids imageTag=latest --query 'images[0].[imageId.imageDigest,imageManifest]' --output text | grep -o 'sha256:[0-9a-f]\{64\}' | sort -u)
          [ -n "$keep" ]
          old=$(aws ecr list-images --repository-name gv-web --query 'imageIds[].imageDigest' --output text | tr '\t' '\n' | grep -vxFf <(echo "$keep") || true)
          if [ -n "$old" ]; then
            aws ecr batch-delete-image --repository-name gv-web --image-ids $(printf 'imageDigest=%s ' $old)
          fi
