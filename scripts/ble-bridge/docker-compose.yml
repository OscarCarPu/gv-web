# Runs the BLE bridge on whichever machine has the Bluetooth radio.
#
#   cd scripts/ble-bridge
#   echo "LIGHTS_BRIDGE_TOKEN=$(python3 -c 'import secrets;print(secrets.token_urlsafe(24))')" > .env
#   docker compose up -d --build
#
# `restart: unless-stopped` is the whole point: this host has no systemd user session, so
# a hand-started daemon dies with the terminal and never comes back after a reboot. Docker
# itself is a boot service here, so the container is what survives.
#
# Put the same token in gv-web's .env (LIGHTS_BRIDGE_TOKEN) along with
# LIGHTS_DRIVER=bridge and LIGHTS_BRIDGE_URL=http://<this-host>:8477.

services:
  ble-bridge:
    build: .
    container_name: ble-bridge
    restart: unless-stopped
    ports:
      - '8477:8477'
    volumes:
      # The only thing the container needs from the host. BlueZ does the radio work in
      # bluetoothd; this is just the wire to it. Read-write because D-Bus is a two-way
      # socket, not a file.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    environment:
      # Read by bridge.py as the --token default. Set it in .env next to this file.
      - LIGHTS_BRIDGE_TOKEN=${LIGHTS_BRIDGE_TOKEN:?set LIGHTS_BRIDGE_TOKEN in scripts/ble-bridge/.env}
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
    healthcheck:
      # /health needs no auth, so it doubles as the liveness probe.
      test:
        [
          'CMD',
          'python3',
          '-c',
          'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8477/health",timeout=5).status==200 else 1)',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
